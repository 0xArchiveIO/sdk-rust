[package]
name = "oxarchive"
version = "1.13.0"
edition = "2021"
rust-version = "1.85"
description = "Rust SDK for async 0xArchive market data clients"
license = "MIT"
repository = "https://github.com/0xArchiveIO/sdk-rust"
homepage = "https://www.0xarchive.io/github-rust"
documentation = "https://docs.rs/oxarchive"
keywords = ["market-data", "hyperliquid", "lighterxyz", "orderbook", "trading"]
categories = ["api-bindings", "finance"]
readme = "README.md"
# An allowlist of what ships. Cargo ignores `exclude` once `include` is set, and
# `include` does not consult .gitignore, so every file is named one by one: a
# glob such as `/src/**/*.rs` would also pick up untracked local files. A new
# source file must be added here; the package-contents workflow fails when a
# tracked source file is missing from the crate.
include = [
    "/src/client.rs",
    "/src/error.rs",
    "/src/exchanges.rs",
    "/src/http.rs",
    "/src/l4_reconstructor.rs",
    "/src/lib.rs",
    "/src/orderbook_reconstructor.rs",
    "/src/resources/breadth.rs",
    "/src/resources/candles.rs",
    "/src/resources/cvd.rs",
    "/src/resources/data_quality.rs",
    "/src/resources/funding.rs",
    "/src/resources/instruments.rs",
    "/src/resources/l2_orderbook.rs",
    "/src/resources/l3_orderbook.rs",
    "/src/resources/l4_orderbook.rs",
    "/src/resources/liquidations.rs",
    "/src/resources/mod.rs",
    "/src/resources/open_interest.rs",
    "/src/resources/oracle.rs",
    "/src/resources/orderbook.rs",
    "/src/resources/orders.rs",
    "/src/resources/positions.rs",
    "/src/resources/spot.rs",
    "/src/resources/trades.rs",
    "/src/resources/wallets.rs",
    "/src/resources/web3.rs",
    "/src/resources/webhooks.rs",
    "/src/types.rs",
    "/src/webhook_signature.rs",
    "/src/ws/client.rs",
    "/src/ws/mod.rs",
    "/examples/basic.rs",
    "/examples/levels_smoke.rs",
    "/examples/pagination.rs",
    "/examples/spot.rs",
    "/examples/websocket.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Cargo.toml",
]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }

# Cargo.lock is intentionally untracked; keep fresh resolution within rust-version = "1.85".
# These compatibility bounds stop transitive MSRV widenings.
url = ">=2.5.0, <2.5.3"
urlencoding = "2"
# reqwest's current encoding_rs release raises its MSRV to Rust 1.88.
encoding_rs = ">=0.8.34, <0.8.40"
zeroize = ">=1.8, <1.9"
indexmap = ">=2.11.4, <2.12"
native-tls = ">=0.2.13, <0.2.14"
openssl-sys = ">=0.9.114, <0.9.115"

# Webhook signature verification. Both are small, pure-Rust RustCrypto crates,
# and `hmac`'s `verify_slice` is the constant-time comparison the verifier
# needs, so no further dependency is required for it.
hmac = "0.12"
sha2 = "0.10"

# WebSocket (optional)
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = []
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.5"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "pagination"
path = "examples/pagination.rs"

[[example]]
name = "spot"
path = "examples/spot.rs"

[[example]]
name = "websocket"
path = "examples/websocket.rs"
required-features = ["websocket"]

[package.metadata.docs.rs]
# Document the `websocket` feature (`oxarchive::ws`) on docs.rs.
all-features = true

[workspace]
